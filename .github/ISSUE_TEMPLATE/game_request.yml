name: Game support request or bring-up report
description: Ask for support for a game you legally own and acquired, or report how far a game without a profile gets
body:
  - type: markdown
    attributes:
      value: |
        A game without a profile can be tried as it is: run `scripts/build_ipa_from_nsp.py` on your own dump of it (your legally owned and acquired game files: its NSP folder, or a Switch 2 game's `.nup`, `.nx` or dump folder). It writes a survey of the game
        (`<title ID>_survey/survey.md`), a provisional profile and a best-effort build ([Port another game](https://github.com/kencalx/NX18/blob/main/docs/development.md#port-another-game)).
        The survey tells whoever picks the game up most of what they need. Never attach game files, keys or anything extracted from a game.
        Requests for game files, keys or where to find them are closed.
  - type: input
    id: game
    attributes:
      label: Game, title ID and version
      placeholder: "<game name>, <base game title ID>, <version>"
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine and graphics API, if known
      description: The survey names both (for example Unreal Engine 4, Unity, NVN, Vulkan, OpenGL).
    validations:
      required: false
  - type: textarea
    id: survey
    attributes:
      label: Survey and what happened
      description: Attach `survey.md` if you ran the NSP script, and say how far the game got (it boots, shows a title, crashes at ..., draws wrong). Attach the log of a run if there was one.
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and OS you would play on
      placeholder: iPhone 18 Pro Max, iOS 27.3
    validations:
      required: false
  - type: checkboxes
    id: no-game-files
    attributes:
      label: No game files
      options:
        - label: Nothing attached here contains game files, keys or data extracted from a game.
          required: true
